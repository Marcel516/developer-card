<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <h1>User Dashboard</h1>

        <section class="panel">
            <label for="userIdInput">User-ID</label>

            <input
                id="userIdInput"
                type="number"
                placeholder="z. B. 1"
            >

            <button id="loadUserButton" type="button">
                Benutzer laden
            </button>

            <p id="statusMessage" aria-live="polite"></p>
            <p id="userError" aria-live="assertive"></p>
        </section>

        <section id="userSection" class="panel" hidden>
            <p id="userName"></p>
            <p id="userEmail"></p>
            <p id="userCity"></p>
        </section>

        <section id="postsSection" class="panel" hidden>
            <h2>Beiträge</h2>

            <label for="postSearchInput">Beiträge durchsuchen</label>

            <input
                id="postSearchInput"
                type="text"
                placeholder="Suchbegriff eingeben"
            >

            <label for="sortPostsSelect">Sortierung</label>

            <select id="sortPostsSelect">
                <option value="default">Standard</option>
                <option value="asc">Titel A-Z</option>
                <option value="desc">Titel Z-A</option>
            </select>

            <label>
                <input id="favoritesOnlyCheckbox" type="checkbox">
                Nur Favoriten anzeigen
            </label>

            <p id="postCount"></p>

            <ul id="postList"></ul>

            <div id="pagination">
                <button id="prevPageButton" type="button">Zurück</button>

                <span id="pageInfo"></span>

                <button id="nextPageButton" type="button">Weiter</button>
            </div>

        </section>

        <section id="postDetailSection" class="panel" hidden>
            <h2 id="postDetailHeading" tabindex="-1">Post-Details</h2>

            <h3 id="postDetailTitle"></h3>
            <p id="postDetailBody"></p>

            <button id="closePostDetailButton" type="button">
                Schließen
            </button>
        </section>

        <section id="editPostSection" class="panel" hidden>
            <h2 id="editPostHeading" tabindex="-1">Post bearbeiten</h2>

            <label for="editPostTitle">Titel</label>
            <input id="editPostTitle" type="text">

            <label for="editPostBody">Text</label>
            <textarea id="editPostBody"></textarea>

            <button id="savePostButton" type="button">
                Speichern
            </button>

            <button id="cancelEditButton" type="button">
                Abbrechen
            </button>
        </section>

        <section id="createPostSection" class="panel">
            <h2>Neuen Post erstellen</h2>

            <label for="newPostTitle">Titel</label>
            <input id="newPostTitle" type="text">

            <label for="newPostBody">Text</label>
            <textarea id="newPostBody"></textarea>

            <button id="createPostButton" type="button">
                Post erstellen
            </button>

            <p id="createPostError" aria-live="assertive"></p>
        </section>

        <button id="resetPostsButton" type="button">
            Lokale Änderungen zurücksetzen
        </button>


    </main>

    <script type="module" src="/main.js"></script>
</body>
</html>
